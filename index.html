<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Analitik Buku</title>
<meta name="theme-color" content="#1f3b2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d1d1b;--mute:#6b675e;--acc:#1f3b2d;--star:#e0a100;--line:#e3ddd0}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1f1e1b;--ink:#efece4;--mute:#a19c90;--acc:#7fc39b;--line:#33312c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:19px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.grid>div{min-width:0}
html,body{overflow-x:hidden;max-width:100%}
.grid .full{grid-column:1/-1}
label{font-size:11px;color:var(--mute);display:block}
input,select{width:100%;min-width:0;-webkit-appearance:none;appearance:none;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
.row2{display:flex;gap:6px}
#info{font-size:12px;color:var(--mute);margin:8px 14px 0}
#stats{display:flex;gap:6px;margin:8px 14px 0;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.stat b{display:block;font-size:16px}
main{padding:8px 14px 40px}
.book{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;text-decoration:none;color:inherit}
.book img,.book .noimg{width:52px;height:78px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.rank{font-size:12px;color:var(--mute);width:26px;flex:none;text-align:right}
.t{font-weight:650}
.a{color:var(--mute);font-size:13px}
.m{font-size:13px;margin-top:3px}
.star{color:var(--star);font-weight:700}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--mute)}
#more{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.warn{color:#b3261e}
</style>
</head>
<body>
<header>
  <h1>📚 Analitik Buku</h1>
  <div class="grid">
    <div class="full"><label>Cari judul / penulis</label><input id="q" type="search" placeholder="mis. Tolkien" autocomplete="off"></div>
    <div><label>Urutkan</label>
      <select id="sort">
        <option value="rating">⭐ Rating tertinggi</option>
        <option value="count">👥 Total rating terbanyak</option>
        <option value="new">🆕 Tahun terbaru</option>
        <option value="old">📜 Tahun terlama</option>
      </select></div>
    <div><label>Kategori</label><select id="cat"><option value="">Semua kategori</option></select></div>
    <div><label>Tahun terbit</label><div class="row2"><input id="y1" type="number" inputmode="numeric" placeholder="dari"><input id="y2" type="number" inputmode="numeric" placeholder="sampai"></div></div>
    <div><label>Minimal total rating</label><input id="minc" type="number" inputmode="numeric" min="0" placeholder="0"></div>
  </div>
</header>
<div id="info"></div>
<div id="stats"></div>
<main><div id="list"></div><button id="more" hidden>Tampilkan lebih banyak</button></main>
<script>
const CATS=['Adventure','Art','Biography','Business','Chick Lit','Children','Classics','Contemporary','Cookbook','Crime','Dystopian','Economics','Fantasy','Graphic Novel','Health','Historical Fiction','History','Horror','Humor','LGBT','Literary Fiction','Manga','Memoir','Mystery','Non-Fiction','Paranormal','Philosophy','Poetry','Politics','Productivity','Psychology','Religion','Romance','Sci-Fi','Science','Self-Help','Short Stories','Spirituality','Thriller','Travel','Urban Fantasy','War','Young Adult'];
const $=id=>document.getElementById(id);
const S={gr:null,rows:[],shown:0,token:0};
const PAGE=50;
CATS.forEach(c=>$('cat').add(new Option(c,c)));
const nf=new Intl.NumberFormat('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(id){const v=$(id).value.trim();if(v==='')return null;const n=parseInt(v,10);return Number.isFinite(n)?n:null}
function filters(){
  let y1=num('y1'),y2=num('y2');
  if(y1!==null&&y2!==null&&y1>y2)[y1,y2]=[y2,y1];
  return {q:$('q').value.trim().toLowerCase().slice(0,100),sort:$('sort').value,cat:$('cat').value,y1,y2,minc:Math.max(0,num('minc')??0)};
}
// ---------- data Goodreads ----------
async function loadGR(){
  if(S.gr)return S.gr;
  $('info').textContent='Memuat data Goodreads…';
  const r=await fetch('data/goodreads.json?v=8');
  if(!r.ok)throw new Error('data gagal dimuat ('+r.status+')');
  S.gr=(await r.json()).map(a=>({t:a[0],a:a[1],y:a[2],r:a[3],c:a[4],g:a[5],id:a[6],img:a[7]?(a[7].startsWith('http')?a[7]:'https://images.gr-assets.com/books/'+a[7]):''}));
  return S.gr;
}
const SORTS={rating:(a,b)=>b.r-a.r||b.c-a.c,count:(a,b)=>b.c-a.c,new:(a,b)=>(b.y??-1e9)-(a.y??-1e9)||b.c-a.c,old:(a,b)=>(a.y??1e9)-(b.y??1e9)||b.c-a.c};
function queryGR(data,f){
  return data.filter(b=>
    (!f.cat||b.g.includes(f.cat))&&
    (f.y1===null||(b.y!==null&&b.y>=f.y1))&&(f.y2===null||(b.y!==null&&b.y<=f.y2))&&
    b.c>=f.minc&&(!f.q||b.t.toLowerCase().includes(f.q)||b.a.toLowerCase().includes(f.q))
  ).sort(SORTS[f.sort]);
}
// ---------- tampilan ----------
function link(b){return b.id?`https://www.goodreads.com/book/show/${b.id}`:'https://www.goodreads.com/search?q='+encodeURIComponent(b.isbn||(b.t+' '+b.a))}
function card(b,i){
  return `<a class="book" href="${link(b)}" target="_blank" rel="noopener"><div class="rank">${i+1}</div>`+
  (b.img?`<img loading="lazy" src="${esc(b.img)}" alt="">`:'<div class="noimg"></div>')+
  `<div><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)}${b.y!==null?' · '+b.y:''}</div>`+
  `<div class="m"><span class="star">★ ${b.r.toFixed(2)}</span> · ${nf.format(b.c)} rating</div>`+
  `<div class="tags">${b.g.map(g=>`<span>${esc(g)}</span>`).join('')}</div></div></a>`;
}
function stats(rows,total){
  if(!rows.length){$('stats').innerHTML='';return}
  const avg=rows.reduce((s,b)=>s+b.r,0)/rows.length, sum=rows.reduce((s,b)=>s+b.c,0);
  const ys=rows.map(b=>b.y).filter(y=>y!==null);
  $('stats').innerHTML=`<div class="stat"><b>${nf.format(total)}</b>buku cocok</div><div class="stat"><b>★ ${avg.toFixed(2)}</b>rata-rata</div>`+
   `<div class="stat"><b>${nf.format(sum)}</b>total rating</div>`+(ys.length?`<div class="stat"><b>${Math.min(...ys)}–${Math.max(...ys)}</b>rentang tahun</div>`:'');
}
function render(reset){
  if(reset){$('list').innerHTML='';S.shown=0}
  const part=S.rows.slice(S.shown,S.shown+PAGE);
  $('list').insertAdjacentHTML('beforeend',part.map((b,i)=>card(b,S.shown+i)).join(''));
  S.shown+=part.length;
  $('more').hidden=!(S.shown<S.rows.length);
}
async function run(){
  const tok=++S.token,f=filters();
  try{
    const data=await loadGR(); if(tok!==S.token)return;
    S.rows=queryGR(data,f);
    $('info').textContent='Sumber: Goodreads (±15.000 buku: 10.000 terpopuler + nominasi Choice Awards 2011–2026, rating per 22 Nov 2026). Ketuk buku untuk buka di Goodreads.';
    if((f.y1??0)>2026||(f.y2??0)>2026)$('info').innerHTML='<span class="warn">⚠️ Data tersedia sampai tahun <b>2026</b>.</span>';
    stats(S.rows,S.rows.length);
    render(true);
    if(!S.rows.length)$('list').innerHTML='<p>Tidak ada buku yang cocok. Longgarkan filter.</p>';
  }catch(e){if(tok===S.token)$('info').innerHTML='<span class="warn">Gagal: '+esc(e.message)+'</span>'}
}
$('more').onclick=()=>render(false);
let tm;const deb=()=>{clearTimeout(tm);tm=setTimeout(run,150)};
['q','y1','y2','minc'].forEach(id=>$(id).addEventListener('input',deb));
['sort','cat'].forEach(id=>$(id).addEventListener('change',run));
run();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
